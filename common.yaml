version: "2.4"

services:
  odoo:
    image: ghcr.io/zamberjo/capili-odoo:18.0
    build:
      context: ./odoo
      args:
        DB_VERSION: "17"
        ODOO_VERSION: "18.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    environment:
      EMAIL_FROM: "zamberjo@gmail.com"
      PGDATABASE: &dbname capili
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
    tty: true
    volumes:
      - filestore:/var/lib/odoo:z
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:17-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      CONF_EXTRA: |
        work_mem = 512MB
    volumes:
      - db:/var/lib/postgresql/data:z

  smtpfake:
    image: docker.io/mailhog/mailhog

  backup:
    image: ghcr.io/tecnativa/docker-duplicity-postgres:latest
    hostname: backup.capili.lapanacea.es
    init: true
    environment:
      DB_VERSION: "17"
      DBS_TO_INCLUDE: "^capili"
      DST: "file:///var/backup"
      JOB_500_WHAT: dup full $$SRC $$DST
      JOB_500_WHEN: weekly
      JOB_800_WHAT: dup --force remove-older-than 3M $$DST
      JOB_800_WHEN: weekly
      PGDATABASE: *dbname
      PGUSER: *dbuser
      TZ: "Europe/Madrid"
    volumes:
      - backup_cache:/root:z
      - filestore:/mnt/backup/src/odoo:z
      - ./backups:/var/backup
