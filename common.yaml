version: "2.4"

services:
  odoo:
    image: ghcr.io/zamberjo/capili-odoo:18.0
    build:
      context: ./odoo
      args:
        DB_VERSION: "17"
        ODOO_VERSION: "18.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    environment:
      EMAIL_FROM: "aypollitocomolahasliado@gmail.com"
      PGDATABASE: &dbname capili
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
    tty: true
    volumes:
      - filestore:/var/lib/odoo:z
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "proxy-network"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:17-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      CONF_EXTRA: |
        work_mem = 512MB
    volumes:
      - db:/var/lib/postgresql/data:z

  smtpfake:
    image: docker.io/mailhog/mailhog

  smtpreal:
    image: ghcr.io/docker-mailserver/docker-mailserver:13
    hostname: "smtp.gmail.com"
    stop_grace_period: 1m
    volumes:
      - mailconfig:/tmp/docker-mailserver:z
      - maildata:/var/mail:z
      - maillogs:/var/log/mail:z
      - maillogssupervisord:/var/log/supervisor:z
      - mailstate:/var/mail-state:z
    cap_add:
      - SYS_PTRACE
    environment:
      DEFAULT_RELAY_HOST: "[smtp.gmail.com]:587"
      LOG_LEVEL: info
      ENABLE_SRS: 1
      ONE_DIR: 1
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      POSTFIX_MESSAGE_SIZE_LIMIT: 52428800 # 50 MiB
      RELAY_HOST: "smtp.gmail.com"
      RELAY_PORT: "587"
      RELAY_USER: "aypollitocomolahasliado@gmail.com"
      SMTP_ONLY: 1
      SRS_DOMAINNAME: "gmail.com"
      SRS_EXCLUDE_DOMAINS: "gmail.com"
      SRS_SENDER_CLASSES: envelope_sender,header_sender

  backup:
    image: ghcr.io/tecnativa/docker-duplicity-postgres:latest
    hostname: backup.capili.lapanacea.es
    init: true
    environment:
      DB_VERSION: "17"
      DBS_TO_INCLUDE: "^capili"
      DST: "file:///var/backup"
      EMAIL_FROM: "aypollitocomolahasliado@gmail.com"
      EMAIL_TO: "zamberjo@gmail.com"
      JOB_500_WHAT: dup full $$SRC $$DST
      JOB_500_WHEN: weekly
      JOB_800_WHAT: dup --force remove-older-than 3M $$DST
      JOB_800_WHEN: weekly
      PGDATABASE: *dbname
      PGUSER: *dbuser
      SMTP_HOST: smtplocal
      TZ: "Europe/Madrid"
    volumes:
      - backup_cache:/root:z
      - filestore:/mnt/backup/src/odoo:z
      - ./backups:/var/backup
